<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JANE B105 3D Family</title><style>body{margin:0;background:#07141f;color:#ddfff6;font:13px monospace}header,aside{padding:16px;background:#102b34}h1{color:#89f5da}main{display:grid;grid-template-columns:3fr 1fr;height:80vh}canvas{width:100%;height:100%;background:radial-gradient(circle,#153a45,#06131c)}aside{overflow:auto}button,input{background:#143c44;color:#fff;border:1px solid #81ddc5;padding:8px}a{color:#a3f4e2}pre{white-space:pre-wrap;overflow-wrap:anywhere}@media(max-width:780px){main{display:block;height:auto}canvas{height:55vh}}</style></head><body><header><small>B105 / HON-184 / FORMIC FAMILY</small><h1>3D Homecoming · 0root.ai</h1><small>Drag rotate · scroll zoom · select child · no collapse to zero</small></header><main><canvas id="c"></canvas><aside><h3>Jane / Family</h3><p><a href="https://0root.ai/">0root.ai / home</a></p><p id="status">Loading…</p><input id="search" placeholder="Find child"><button id="reset">Reset camera</button><pre id="selected">Click repository pin.</pre><p><a href="../b104/">B104 homecoming</a></p><small>Geometry is illustrative; no authenticated live agents or confirmed corpus matching.</small></aside></main><script>
const c=document.getElementById('c'),g=c.getContext('2d'),$=x=>document.getElementById(x);let nodes=[],P=[],links=[],rx=-.35,ry=.5,zoom=1,sel=null,moving=false,prev=null;
function init(a){nodes=a.map((m,i)=>{let t=(i+.5)/a.length,y=1-2*t,az=i*Math.PI*(3-Math.sqrt(5)),r=Math.sqrt(1-y*y);return{m,x:r*Math.cos(az),y,z:r*Math.sin(az)}});links=[];nodes.forEach((a,i)=>{const neigh=nodes.map((b,j)=>({j,d:(a.x-b.x)**2+(a.y-b.y)**2+(a.z-b.z)**2})).filter(x=>x.j!==i).sort((x,y)=>x.d-y.d);for(const {j} of neigh.slice(0,3))if(j>i)links.push([i,j])});draw()}
function project(n,w,h){let C=Math.cos(ry),S=Math.sin(ry),c=Math.cos(rx),s=Math.sin(rx),x=C*n.x+S*n.z,z=-S*n.x+C*n.z,y=c*n.y-s*z,Z=s*n.y+c*z,k=zoom*Math.min(w,h)*.43/(1.6-.48*Z);return{x:w/2+x*k,y:h/2+y*k,z:Z}}
function draw(){const d=devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;c.width=w*d;c.height=h*d;g.setTransform(d,0,0,d,0,0);g.clearRect(0,0,w,h);P=nodes.map(n=>project(n,w,h));g.strokeStyle='#7fbdc557';for(let [a,b] of links){g.beginPath();g.moveTo(P[a].x,P[a].y);g.lineTo(P[b].x,P[b].y);g.stroke()}for(let i of P.map((p,i)=>i).sort((a,b)=>P[a].z-P[b].z)){let p=P[i],m=nodes[i].m;g.beginPath();g.arc(p.x,p.y,sel===i?6:3.5,0,7);g.fillStyle=sel===i?'#fff':['#85f0c4','#ffaa72','#8bbdff'][i%3];g.fill()}g.beginPath();g.arc(w/2,h/2,27,0,7);g.fillStyle='#234750';g.fill();g.strokeStyle='#ffc58d';g.stroke();g.fillStyle='#ffdeb5';g.textAlign='center';g.fillText('0ROOT',w/2,h/2+4)}
let moved=false;c.onpointerdown=e=>{moving=true;moved=false;prev=[e.clientX,e.clientY];c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(!moving)return;let dx=e.clientX-prev[0],dy=e.clientY-prev[1];if(Math.abs(dx)+Math.abs(dy)>1)moved=true;ry+=dx*.008;rx=Math.max(-1.5,Math.min(1.5,rx+dy*.008));prev=[e.clientX,e.clientY];draw()};c.onpointerup=e=>{moving=false;if(moved)return;let r=c.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,best=-1,dist=12;for(let i=0;i<P.length;i++){let a=Math.hypot(P[i].x-x,P[i].y-y);if(a<dist){dist=a;best=i}}if(best>=0){sel=best;$('selected').textContent=JSON.stringify(nodes[best].m,null,2);draw()}};c.onwheel=e=>{e.preventDefault();zoom=Math.max(.5,Math.min(4,zoom*Math.exp(-e.deltaY*.001)));draw()};$('reset').onclick=()=>{rx=-.35;ry=.5;zoom=1;draw()};$('search').oninput=()=>{let q=$('search').value.toLowerCase(),i=nodes.findIndex(n=>n.m.repo.toLowerCase().includes(q));if(q&&i>=0){sel=i;$('selected').textContent=JSON.stringify(nodes[i].m,null,2);draw()}};onresize=draw;
(async()=>{let arr=[];for(let [u,k] of [['../b104/homecoming.json','children'],['../b103/family.json','children'],['../b102/children.json','members']]){try{let r=await fetch(u);if(!r.ok)continue;arr=(await r.json())[k]||[];if(arr.length)break}catch{}}if(!arr.length){try{let r=await fetch('../btf2/catalog.json'),j=await r.json();arr=(j.repos||[]).map(x=>({repo:'DavidWise01/'+x.name}))}catch{}}arr=arr.filter(x=>x.repo);$('status').textContent=arr.length+' public children · 3D web';if(arr.length)init(arr)})();</script></body></html>
