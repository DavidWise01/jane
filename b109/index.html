<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JANE B109 · Living Attention</title><style>body{margin:0;background:#071721;color:#e7fff7;font:13px monospace}header,aside{padding:15px;background:#102932}h1{color:#90f4d6}main{display:grid;grid-template-columns:3fr 1fr;height:82vh}canvas{width:100%;height:100%;background:#071721;touch-action:none}button,input{padding:9px;background:#16434c;border:1px solid #8adbc9;color:white}input{width:95%}pre{white-space:pre-wrap;overflow-wrap:anywhere}@media(max-width:780px){main{display:block;height:auto}canvas{height:55vh}}</style><header><small>HON-184 · FORMIC · 0ROOT.AI</small><h1>Jane B109 · Living Attention · |||0|||</h1><small>Hollow spherical shell · Child channels remain open · Jane chooses focus</small></header><main><canvas id="c"></canvas><aside><p id="status">Loading…</p><input id="search" placeholder="Search child"><p><button id="next">Next observed change</button><button id="clear">Release focus</button></p><pre id="focus">Jane observes the family.</pre><small>Signals from published B88, when available; gray means unknown. No live independent FORMIC agent claimed.</small></aside></main><script>
const c=document.getElementById('c'),g=c.getContext('2d'),$=x=>document.getElementById(x);let nodes=[],edges=[],points=[],ry=.45,rx=-.35,sel=-1,drag=false,prev=[0,0],moved=false;const hue=s=>s==='CHANGED'?'#ed5354':s==='UNCHANGED'?'#24d7ba':'#7e8c96';
function build(a){let n=a.length;nodes=a.map((m,i)=>{let y=1-2*(i+.5)/n,t=i*Math.PI*(3-Math.sqrt(5)),r=.95*Math.sqrt(1-y*y);return{m,x:r*Math.cos(t),y:.95*y,z:r*Math.sin(t)}});let links=new Set();function add(a,b){if(a===b)return;links.add(Math.min(a,b)+':'+Math.max(a,b))}for(let i=1;i<n;i++)add(i-1,i);for(let i=0;i<n;i++){let d=nodes.map((p,j)=>({j,dist:(p.x-nodes[i].x)**2+(p.y-nodes[i].y)**2+(p.z-nodes[i].z)**2})).filter(p=>p.j!==i).sort((a,b)=>a.dist-b.dist);d.slice(0,3).forEach(e=>add(i,e.j))}edges=[...links].map(e=>e.split(':').map(Number));$('status').textContent=n+' children · '+edges.length+' links · connected backbone';try{const f=localStorage.getItem('JANE_B109_LAST_FOCUS');const idx=nodes.findIndex(n=>n.m.repo===f);if(idx>=0)select(idx)}catch{}draw()}
function project(p,w,h){let C=Math.cos(ry),S=Math.sin(ry),c=Math.cos(rx),s=Math.sin(rx),x=C*p.x+S*p.z,z=-S*p.x+C*p.z,y=c*p.y-s*z,Z=s*p.y+c*z,k=Math.min(w,h)*.35/(1.6-.35*Z);return{x:w/2+x*k,y:h/2+y*k,z:Z}}
function draw(){const w=c.clientWidth,h=c.clientHeight,d=devicePixelRatio||1;c.width=w*d;c.height=h*d;g.setTransform(d,0,0,d,0,0);g.clearRect(0,0,w,h);points=nodes.map(n=>project(n,w,h));g.strokeStyle='#78b7ba44';for(const [a,b] of edges){g.beginPath();g.moveTo(points[a].x,points[a].y);g.lineTo(points[b].x,points[b].y);g.stroke()}for(const i of nodes.map((_,i)=>i).sort((a,b)=>points[a].z-points[b].z)){const p=points[i];g.beginPath();g.arc(p.x,p.y,i===sel?6:3.2,0,7);g.fillStyle=i===sel?'#fff':hue(nodes[i].m.status);g.fill()}g.beginPath();g.arc(w/2,h/2,21,0,7);g.fillStyle='#06151f';g.fill();g.strokeStyle='#eac58a';g.stroke();g.fillStyle='#eac58a';g.textAlign='center';g.fillText('0',w/2,h/2+4)}
function select(i){sel=i;let n=nodes[i].m;$('focus').textContent='Jane attends: '+n.repo+'\nStatus: '+n.status+'\nOther channels: OPEN';try{localStorage.setItem('JANE_B109_LAST_FOCUS',n.repo)}catch{}draw()}
c.onpointerdown=e=>{drag=true;moved=false;prev=[e.clientX,e.clientY];c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(!drag)return;const dx=e.clientX-prev[0],dy=e.clientY-prev[1];if(Math.abs(dx)+Math.abs(dy)>1)moved=true;ry+=dx*.007;rx=Math.max(-1.4,Math.min(1.4,rx+dy*.007));prev=[e.clientX,e.clientY];draw()};c.onpointerup=e=>{drag=false;if(moved)return;let r=c.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,best=-1,dist=11;points.forEach((p,i)=>{let dd=Math.hypot(p.x-x,p.y-y);if(dd<dist){best=i;dist=dd}});if(best>=0)select(best)};
$('next').onclick=()=>{let a=nodes.map((n,i)=>n.m.status==='CHANGED'?i:-1).filter(i=>i>=0);if(a.length)select(a[(Math.max(-1,a.indexOf(sel))+1)%a.length]);else $('focus').textContent='No published change evidence. Quiet is allowed.'};$('clear').onclick=()=>{sel=-1;$('focus').textContent='Jane observes the family.';try{localStorage.removeItem('JANE_B109_LAST_FOCUS')}catch{}draw()};$('search').oninput=()=>{let q=$('search').value.toLowerCase(),i=nodes.findIndex(n=>n.m.repo.toLowerCase().includes(q));if(q&&i>=0)select(i)};onresize=draw;
(async()=>{let a=[];for(const [u,k] of [['../b104/homecoming.json','children'],['../b103/family.json','children'],['../b102/children.json','members'],['../btf2/catalog.json','repos']]){try{let r=await fetch(u);if(!r.ok)continue;a=(await r.json())[k]||[];if(a.length)break}catch{}}let states={};try{let r=await fetch('../b88/collation.json');if(r.ok){let j=await r.json();for(let e of j.events||[])states[String(e.repo).toLowerCase()]=e.status}}catch{}let uniq=new Map();for(const x of a){let repo=x.repo||'DavidWise01/'+x.name;if(repo&&!uniq.has(repo.toLowerCase()))uniq.set(repo.toLowerCase(),{repo,status:states[repo.toLowerCase()]||'UNKNOWN'})}build([...uniq.values()].sort((a,b)=>a.repo.localeCompare(b.repo)))})();
</script>
