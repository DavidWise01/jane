<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JANE 166 | The Clocks That Disagree</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 40% -15%,#25474b,#07151c 70%);color:#dbfff7;font:15px system-ui,Segoe UI,sans-serif}.shell{max-width:1080px;margin:auto;padding:22px}.tag{color:#6deed3;letter-spacing:.24em;font-size:12px}h1{color:#ffa64f;text-shadow:0 0 20px #ff740080;margin:8px 0 5px;font-size:clamp(25px,5vw,42px)}p{color:#b9cfd0}canvas{width:100%;height:auto;border:1px solid #668e9b;border-radius:15px;box-shadow:0 0 35px #ec76001f, inset 0 0 30px #fa8b001c;background:#07151f}.controls{display:flex;flex-wrap:wrap;gap:9px;margin:16px 0}button{cursor:pointer;padding:11px 15px;border-radius:9px;color:#ffe8c9;background:#26353a;border:1px solid #b76a35;font-weight:700}button.active{background:#ac4b16;box-shadow:0 0 19px #ff81007a}.status{font-family:ui-monospace,monospace;border:1px solid #346a72;border-radius:11px;padding:16px;background:#10232a}strong{color:#ffb568}.foot{font-size:12px;color:#91a9ac;margin-top:14px}</style></head><body><main class="shell"><div class="tag">{{ CHRONOS }} · FLAY · EXPERIMENT 166</div><h1>THE CLOCKS THAT DISAGREE</h1><p>Three independently labeled fixture witnesses. Signed intervals, never invented agreement.</p><div class="controls"><button class="active" data-mode="match">Overlapping intervals</button><button data-mode="conflict">Clock conflict</button><button data-mode="causal">Causal ambiguity</button></div><canvas id="board" width="1000" height="485" aria-label="Timeline of witness clock uncertainty intervals"></canvas><div class="status" id="status"></div><p class="foot">Fixtures only. Signatures authenticate claims—not clock accuracy or independent real-world control. No automatic promotion.</p></main><script>
const c=document.querySelector('canvas'),x=c.getContext('2d'),buttons=[...document.querySelectorAll('button')],status=document.querySelector('#status');let mode='match';const colors=['#55ead5','#ffad59','#c18cff'];function text(s,px,py,color='#c8f6ef',font='17px ui-monospace,monospace'){x.fillStyle=color;x.font=font;x.fillText(s,px,py)}function line(a,b,d,e,color,width=2){x.strokeStyle=color;x.lineWidth=width;x.beginPath();x.moveTo(a,b);x.lineTo(d,e);x.stroke()}function glowRect(a,b,w,h,color){x.shadowColor=color;x.shadowBlur=17;x.fillStyle=color;x.fillRect(a,b,w,h);x.shadowBlur=0}function draw(){x.clearRect(0,0,1000,485);x.fillStyle='#08151d';x.fillRect(0,0,1000,485);for(let gx=95;gx<960;gx+=70){line(gx,80,gx,395,'#173a46',1)}for(let gy=75;gy<420;gy+=60){line(80,gy,962,gy,'#173a46',1)}text('JANE 166  /  SIGNED CHRONOS RANGES',39,40,'#ffa64f','22px ui-monospace,monospace');let series=mode==='match'?[[88,128],[94,134],[82,122]]:mode==='conflict'?[[78,98],[105,125],[178,200]]:[[55,105],[102,152],[78,130]];const axisStart=mode==='conflict'?60:45,axisEnd=mode==='conflict'?220:165,map=t=>115+(t-axisStart)/(axisEnd-axisStart)*815;for(let i=0;i<3;i++){let y=135+i*108;let [lo,hi]=series[i];text('ROOT '+['A','B','C'][i]+'  '+(lo+' — '+hi),42,y-32,colors[i]);line(map(lo),y,map(hi),y,colors[i],12);glowRect(map(lo)-4,y-14,8,28,colors[i]);glowRect(map(hi)-4,y-14,8,28,colors[i]);text('SIGNED',845,y-22,'#718a94','13px ui-monospace,monospace')}line(112,406,947,406,'#779399',2);text('EARLIER',112,440);text('LATER',858,440);const min=Math.max(...series.map(q=>q[0])),max=Math.min(...series.map(q=>q[1]));if(mode==='match'){const a=map(min),b=map(max);x.fillStyle='#47dec535';x.fillRect(a,83,b-a,310);text('SHARED  '+min+' — '+max,a,80,'#78ffdf')}else if(mode==='conflict'){text('NO SHARED INTERSECTION',300,82,'#ff9e68')}else{text('TIMESTAMP OVERLAP ≠ CAUSAL ORDER',260,82,'#ff9e68')}status.innerHTML=mode==='match'?'<strong>MATCHED_FIXTURE_INTERVAL</strong> — All three authenticated interval claims overlap. This is not proof that any clock is accurate.':mode==='conflict'?'<strong>CLOCK_CONFLICT</strong> — Disjoint authenticated time intervals; preserve all three claims. No averaging.':'<strong>TEMPORAL_AMBIGUOUS</strong> — Intervals overlap; the clock evidence alone cannot decide which event happened first.'}buttons.forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.mode;buttons.forEach(q=>q.classList.toggle('active',q===b));draw()}));draw();</script></body></html>
