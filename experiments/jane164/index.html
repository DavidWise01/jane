<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JANE 164 · Checkpoint That Survives</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -15%,#184a4f,#081116 65%);font:15px system-ui;color:#e4fcf7}header{padding:18px 22px;border-bottom:1px solid #397875;display:flex;align-items:center;gap:18px;flex-wrap:wrap}h1{font-size:22px;margin:0;color:#ff9a42;text-shadow:0 0 13px #f57438}main{max-width:1080px;margin:18px auto;padding:0 14px}.panel{border:1px solid #456f70;border-radius:16px;background:#0b242a;box-shadow:0 0 26px #0ddac41a;padding:14px}canvas{width:100%;height:390px;display:block}button{border:1px solid #67d9c4;color:#ddfff5;background:#163a40;padding:11px 13px;border-radius:9px;cursor:pointer}button:hover,button.active{background:#ba5b25;color:white;border-color:#ffab5b}nav{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:14px}p{line-height:1.55}.tag{color:#ffc684}#state{font-weight:700;color:#ff9a42}</style></head><body><header><h1>JANE 164 · THE CHECKPOINT THAT SURVIVES</h1><span>FLAY / SIGNED CUSTODY / CHRONOS</span></header><main><nav><button class="active" data-scene="match">Anchored match</button><button data-scene="extension">Valid extension</button><button data-scene="truncation">Clean truncation</button><button data-scene="fork">Signed fork</button><button data-scene="admin">Shared administration</button></nav><div class="panel"><canvas id="c" width="1000" height="390" aria-label="Illustrated scheduler checkpoints and three signed custody roots"></canvas><p id="state">ANCHORED_MATCH</p><p id="explanation">All six scheduled decisions agree with the separately retained signed checkpoint.</p><p class="tag">This is a deterministic Canvas2D illustration of local fixtures—not a live hosted custody service.</p></div></main><script>
const c=document.querySelector('canvas'),ctx=c.getContext('2d'),state=document.querySelector('#state'),exp=document.querySelector('#explanation');let scene='match',phase=0;
const cases={match:['ANCHORED_MATCH','All six decisions match the signed checkpoint retained outside the returned log.',6,6],extension:['VALID_EXTENSION','The six anchored records match; a valid chain extends to sequence nine.',9,6],truncation:['CLEAN_SUFFIX_TRUNCATION','Only four local records return. External custodians retain a signed commitment to sequence six.',4,6],fork:['SIGNED_FORK','The same claimed custody root has signed conflicting heads for the same checkpoint.',6,6],admin:['SHARED_ADMINISTRATION','Three keys do not count as three separately administered custody roots.',6,6]};
function line(x,y,x2,y2,color,width=2){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x2,y2);ctx.stroke()}
function box(x,y,w,h,color,label){ctx.shadowBlur=14;ctx.shadowColor=color;ctx.strokeStyle=color;ctx.lineWidth=2;ctx.fillStyle='#103238';ctx.beginPath();ctx.roundRect(x,y,w,h,12);ctx.fill();ctx.stroke();ctx.shadowBlur=0;ctx.fillStyle='#dff';ctx.font='bold 16px system-ui';ctx.textAlign='center';ctx.fillText(label,x+w/2,y+h/2+6)}
function draw(){phase+=.025;ctx.clearRect(0,0,1000,390);let [name,msg,local,anchor]=cases[scene];let bad=['truncation','fork','admin'].includes(scene);ctx.textAlign='left';ctx.fillStyle='#78d9cf';ctx.font='14px system-ui';ctx.fillText('RETURNED LOCAL SCHEDULER LOG',26,34);ctx.fillText('SEPARATELY RETAINED SIGNED COMMITMENT',26,195);
for(let i=1;i<=9;i++){const x=27+(i-1)*103;if(i<=local)box(x,48,72,55,i<=6?'#55d8c2':'#ff9a42',String(i).padStart(3,'0'));else if(i<=anchor)box(x,48,72,55,'#714c55','?');if(i>1&&i<=local)line(x-31,75,x-4,75,'#58adac');if(i<=anchor)line(x+34,108,x+34,183,'#387c77',1)}
for(let i=0;i<3;i++){const x=110+i*300;box(x,230,175,60,scene==='admin'?'#ff9a42':scene==='fork'&&i===2?'#ed658b':'#62d7cf','CUSTODY '+String.fromCharCode(65+i));line(x+87,216,x+87,230,'#63a69e')}
ctx.font='bold 20px system-ui';ctx.fillStyle=bad?'#ff9276':'#6dedce';ctx.textAlign='center';ctx.fillText(name,500,352);ctx.font='12px system-ui';ctx.fillStyle='#aad4d1';ctx.fillText('fixture · three signed keys · no verified operator independence',500,376);requestAnimationFrame(draw)}
for(const b of document.querySelectorAll('button'))b.onclick=()=>{scene=b.dataset.scene;document.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));state.textContent=cases[scene][0];exp.textContent=cases[scene][1]};draw();
</script></body></html>
