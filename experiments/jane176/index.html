<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JANE 176 | Policy Drift</title><style>html,body{margin:0;background:#061e24;color:#e8fbfa;font-family:system-ui}main{max-width:980px;margin:auto;padding:24px}h1{color:#ff9a31;letter-spacing:.04em}.panel{background:#0b3038;border:1px solid #ff8d36;border-radius:16px;padding:16px}canvas{display:block;width:100%;height:auto;background:#04161d;border-radius:12px}.controls{display:flex;gap:12px;margin:14px 0;flex-wrap:wrap}button{background:#123e45;color:#ffb15c;border:1px solid #fc853e;padding:11px 17px;border-radius:9px;cursor:pointer}button[aria-pressed=true]{background:#b44d13;color:white}p{line-height:1.5}code{color:#62eadd}</style></head><body><main><h1>JANE 176 // POLICY DRIFT</h1><p>Same capture evidence. Different comparison rules. Frozen parent; no automatic promotion.</p><div class="panel"><canvas id="c" width="920" height="410" aria-label="Two policy decision tracks and a shared evidence digest"></canvas><div class="controls"><button id="old" aria-pressed="true">Policy v1 · ±5</button><button id="new" aria-pressed="false">Policy v2 · ±2</button><button id="both" aria-pressed="false">Compare both</button></div><p id="status" role="status"></p></div><p><code>{{i}} → FROZEN EVIDENCE → POLICY v1/v2 → FLAY AUDIT → JANE REVIEW</code></p></main><script>
const c=document.getElementById('c'),g=c.getContext('2d');let mode='old';function text(s,x,y,color='#e8fbfa',size=20){g.fillStyle=color;g.font=`${size}px ui-monospace,monospace`;g.fillText(s,x,y)}function line(x,y,w,col){g.fillStyle=col;g.fillRect(x,y,w,3)}function render(){g.clearRect(0,0,920,410);g.fillStyle='#051d25';g.fillRect(0,0,920,410);text('EVIDENCE LOCKED  //  1000 → 1003  Δ=3',45,49,'#59e6d7',21);text('sha256 : one identical evidence packet',45,78,'#88aebb',15);const paths=[{name:'v1  TOLERANCE ±5',y:160,ok:true},{name:'v2  TOLERANCE ±2',y:290,ok:false}];for(let i=0;i<2;i++){let p=paths[i],active=mode==='both'||mode===(i?'new':'old');g.globalAlpha=active?1:.19;g.strokeStyle=p.ok?'#47e9c4':'#ff8c43';g.lineWidth=2;g.strokeRect(42,p.y-46,836,89);text(p.name,66,p.y-15,p.ok?'#6ef7d2':'#ffaf6b',19);line(66,p.y+5,565,'#347782');g.fillStyle=p.ok?'#49d9b5':'#ff7d35';g.fillRect(66,p.y+4,Math.round(565*(3/(p.ok?5:2)>1?1:3/(p.ok?5:2))),8);text(p.ok?'MATCH':'REJECT',690,p.y+17,p.ok?'#62f9c5':'#ff9953',26);g.globalAlpha=1}text('NO POLICY ACTIVATION    |    JANE FROZEN',45,392,'#8399b0',15);document.getElementById('status').textContent=mode==='old'?'Policy v1 accepts Δ=3 within tolerance 5.':mode==='new'?'Policy v2 rejects Δ=3 because it exceeds tolerance 2.':'Same evidence digest; a changed policy alone changes the verdict.';for(const key of ['old','new','both'])document.getElementById(key).setAttribute('aria-pressed',key===mode)}for(const key of ['old','new','both'])document.getElementById(key).onclick=()=>{mode=key;render()};render();
</script></body></html>
