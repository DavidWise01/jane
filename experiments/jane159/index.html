<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JANE 159 — Guarded Forces</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{background:radial-gradient(circle at 50% 15%,#184a50,#09141c 65%);color:#e2f9ff;font:15px system-ui;margin:0}main{max-width:1100px;margin:auto;padding:22px}.chrome{border:1px solid #ff9b4f;box-shadow:0 0 19px #ff640030,inset 0 0 20px #50e4e21c;border-radius:20px;background:#102b37c9;padding:22px}h1{color:#ffad62;text-shadow:0 0 15px #ff7511;font-size:clamp(23px,4vw,42px);margin:0}p{color:#afd2d5}.controls{display:flex;gap:12px;flex-wrap:wrap;margin:18px 0}button{border:1px solid #ff9e4a;background:#281b1b;color:#ffca98;padding:11px 18px;border-radius:9px;cursor:pointer}button.active{background:#ff882c;color:#101b25;box-shadow:0 0 18px #ff7d34}canvas{width:100%;height:460px;border:1px solid #58cfc7;border-radius:10px;background:#081f29}pre{white-space:pre-wrap;color:#a6f2db;background:#091924;padding:16px;border-radius:12px}small{color:#9dabb8}a{color:#86f5e0}</style></head><body><main><section class="chrome"><h1>JANE 159 | GUARDED FORCES</h1><p>FLAY examines *enabled* transitions. An offered force isn't necessarily a reachable action. Past observes. Present deserves. Future reserves.</p><div class="controls"><button id="guarded" class="active">Guarded s &lt; 20</button><button id="free">Unconditional +1</button><button id="budget">Insufficient budget</button></div><canvas id="mesh" aria-label="Canvas2D reachable state mesh"></canvas><pre id="status"></pre><small>Fixture-only witness model • local deterministic experiment • no autonomous Jane activation</small></section></main><script>
const cv=document.getElementById('mesh'),cx=cv.getContext('2d');let mode='guarded',t=0;const modes=['guarded','free','budget'];for(const m of modes){document.getElementById(m).onclick=()=>{mode=m;for(const n of modes)document.getElementById(n).classList.toggle('active',n===m);render()}}function render(){const dpr=devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;cv.width=w*dpr;cv.height=h*dpr;cx.scale(dpr,dpr);cx.clearRect(0,0,w,h);const N=mode==='budget'?5:mode==='guarded'?21:23;cx.font='12px monospace';cx.textAlign='center';for(let i=0;i<N;i++){const x=38+(i%11)*(w-76)/10,y=65+Math.floor(i/11)*150;const unsafe=i>20;cx.beginPath();cx.arc(x,y,17,0,Math.PI*2);cx.fillStyle=unsafe?'#6c2d23':'#173e49';cx.fill();cx.lineWidth=2;cx.shadowBlur=16;cx.shadowColor=unsafe?'#ff652d':'#35e8ce';cx.strokeStyle=unsafe?'#ff652d':'#35e8ce';cx.stroke();cx.shadowBlur=0;cx.fillStyle=unsafe?'#ffb08a':'#e2fcfb';cx.fillText(i,x,y+4);if(i<N-1){const nx=38+((i+1)%11)*(w-76)/10,ny=65+Math.floor((i+1)/11)*150;cx.strokeStyle='#fba455';cx.beginPath();cx.moveTo(x+14,y);cx.lineTo(nx-14,ny);cx.stroke()}}cx.textAlign='left';cx.fillStyle='#ffab65';cx.font='bold 16px system-ui';cx.fillText(mode==='guarded'?'REACHABLE STATES: 0..20':mode==='free'?'ESCAPE: 20 → 21':'BUDGET EXHAUSTED',24,h-40);document.getElementById('status').textContent=mode==='guarded'?'BOUNDED_REACHABLE_SET • complete reachable graph • guard disables +1 at 20':mode==='free'?'BOUND_VIOLATED • 20 → 21 • unconditional translation permits infinite growth':'INCONCLUSIVE_BUDGET • 5 visited states • no boundedness proof';}window.addEventListener('resize',render);render();</script></body></html>
