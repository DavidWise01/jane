<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JANE 178 | Delegation Chains</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 46% 12%,#1d4149,#0a111c 68%);color:#e5fff8;font:15px system-ui,Segoe UI,sans-serif}.shell{width:min(1200px,96vw);margin:18px auto;padding:20px;border:1px solid #5b9c99;border-radius:18px;background:linear-gradient(140deg,#102633ef,#10121eee);box-shadow:0 0 42px #00ffd125}header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{margin:0;font-size:clamp(23px,4vw,38px);letter-spacing:.08em;color:#ff9b48;text-shadow:0 0 14px #ff7a3080}p{color:#b3d0d1}canvas{width:100%;height:min(65vh,540px);display:block;border-radius:12px;border:1px solid #2d7477;background:#07121c}nav{display:flex;gap:10px;flex-wrap:wrap;padding:14px 0}button{padding:10px 15px;border-radius:9px;border:1px solid #ff9e58;background:#32231f;color:#ffcf9b;font-weight:700;cursor:pointer}button.selected{background:#ff8e35;color:#13151a;box-shadow:0 0 14px #ff7a3070}.bottom{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}.status{font-weight:bold;color:#68e7cc}code{color:#ffa866}
</style></head><body><main class="shell"><header><h1>JANE 178 // DELEGATION CHAIN</h1><span>FLAY · {{ i }} · CHRONOS</span></header><p>A signed delegation can only narrow inherited authority. Explore valid inheritance, attempted escalation, and revocation.</p><nav><button data-mode="valid" class="selected">Valid chain</button><button data-mode="scope">Scope escalation</button><button data-mode="time">Time escalation</button><button data-mode="revoke">Parent revoked</button></nav><canvas id="view" width="1100" height="520" role="img" aria-label="Interactive signed authority chain"></canvas><div class="bottom"><p id="description" class="status">AUTHORIZED_FIXTURE</p><p><code>45 / 45 local tests passed · synthetic keys only</code></p></div></main><script>
const c=document.getElementById('view'),g=c.getContext('2d');let mode='valid',tick=0;const choices={valid:['AUTHORIZED_FIXTURE','Bob inherits calibration only; scope and interval shrink.'],scope:['ESCALATION','Bob attempts to add sensor policy, beyond Alice\'s calibration grant.'],time:['ESCALATION','Bob requests authorization past Alice\'s signed expiration.'],revoke:['REVOKED','Root revokes Alice; Bob\'s inherited authority is disabled.']};
function box(x,y,w,h,label,sub,color){g.fillStyle='#102730';g.strokeStyle=color;g.lineWidth=2;g.shadowColor=color;g.shadowBlur=13;g.beginPath();g.roundRect(x,y,w,h,15);g.fill();g.stroke();g.shadowBlur=0;g.fillStyle='#f3f7f8';g.font='bold 25px system-ui';g.textAlign='center';g.fillText(label,x+w/2,y+40);g.fillStyle='#a6c9ca';g.font='17px system-ui';g.fillText(sub,x+w/2,y+70)}
function wire(x1,y1,x2,y2,color){g.strokeStyle=color;g.lineWidth=3;g.shadowColor=color;g.shadowBlur=9;g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke();g.shadowBlur=0}
function render(){tick++;g.clearRect(0,0,1100,520);let gradient=g.createLinearGradient(0,0,1100,520);gradient.addColorStop(0,'#09222c');gradient.addColorStop(1,'#170e23');g.fillStyle=gradient;g.fillRect(0,0,1100,520);const ok=mode==='valid',color=ok?'#57edc5':'#ff8551',pulse=.78+.2*Math.sin(tick/25);g.globalAlpha=pulse;wire(550,108,550,150,'#5bf1e2');wire(550,236,550,280,mode==='revoke'?'#ff7045':'#5bf1e2');wire(550,366,550,398,color);g.globalAlpha=1;box(405,22,290,86,'ROOT','calibration + sensor | t 0–100','#70e4f0');box(405,150,290,86,'ALICE','calibration | t 10–80',mode==='revoke'?'#ff8350':'#ffb36d');box(405,280,290,86,'BOB',mode==='scope'?'calibration + sensor':mode==='time'?'calibration | t 20–90':'calibration | t 20–60',color);box(350,398,400,84,'FLAY VERDICT',choices[mode][0],color);g.textAlign='left';g.fillStyle='#ffbd7e';g.font='bold 17px monospace';g.fillText('SIGNED  •  SCOPE  •  TIME  •  DEPTH  •  REVOCATION',18,504);document.getElementById('description').textContent=choices[mode][0]+' — '+choices[mode][1];requestAnimationFrame(render)}document.querySelectorAll('button').forEach(btn=>btn.onclick=()=>{mode=btn.dataset.mode;document.querySelectorAll('button').forEach(b=>b.classList.toggle('selected',b===btn))});render();
</script></body></html>
