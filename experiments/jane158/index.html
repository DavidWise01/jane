<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JANE 158 — The Region That Cannot Be Closed</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 40% -20%,#164e54,#08141a 63%);font:15px system-ui;color:#d5f8ee}.app{max-width:1180px;margin:auto;padding:16px}header{display:flex;align-items:center;justify-content:space-between;gap:10px}h1{font-size:clamp(19px,3vw,28px);margin:6px 0;color:#ffac55}.tag{color:#75d8cf;border:1px solid #3b8e8a;border-radius:30px;padding:5px 10px;font-size:12px}.layout{display:grid;grid-template-columns:3fr 1fr;gap:12px;margin-top:12px}canvas{display:block;width:100%;height:min(60vh,520px);background:#08151c;border:1px solid #426765;border-radius:12px}.panel{border:1px solid #356b69;background:#10232a;border-radius:12px;padding:14px}label{display:block;margin-bottom:12px;font-size:13px;color:#86dfd1}select,input,button{width:100%;background:#19383f;color:#ffe3bc;border:1px solid #6aa99c;border-radius:8px;padding:9px;margin-top:6px}button{cursor:pointer;background:#ac5c25;color:white}pre{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6;font:12px/1.7 ui-monospace,monospace}footer{color:#a4beb8;font-size:12px;padding-top:12px}strong{color:#ffb46e}@media(max-width:760px){.layout{grid-template-columns:1fr}canvas{height:340px}}</style></head><body><main class="app"><header><div><div class="tag">FLAY • JANE / 158 • FROZEN PARENT</div><h1>The Region That Cannot Be Closed</h1></div><span class="tag">45 TESTS PASSED LOCALLY</span></header><div class="layout"><canvas id="view" width="900" height="520" aria-label="Canvas2D transition graph"></canvas><aside class="panel"><label>Choose transition model<select id="model"><option value="up">Unbounded +1 + reflection</option><option value="down">Unbounded −2</option><option value="reflect">Reflection only</option><option value="guarded">Guarded +1 (not proven)</option></select></label><label>Candidate interval radius <input id="radius" type="range" min="0" max="16" value="5"><output id="rlabel">5</output></label><button id="advance">Step witness trace</button><button id="reset">Reset trace</button><h3 id="verdict"></h3><pre id="details"></pre></aside></div><footer>Visual demonstration only. A finite run never establishes unboundedness; the certified result relies on the globally enabled integer-translation theorem. No networked custody independence is claimed.</footer></main><script>
const c=document.getElementById('view'),ctx=c.getContext('2d'),model=document.getElementById('model'),radius=document.getElementById('radius'),rlabel=document.getElementById('rlabel'),verdict=document.getElementById('verdict'),details=document.getElementById('details');let steps=0;
function draw(){const dpr=window.devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;c.width=Math.round(w*dpr);c.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);const R=+radius.value,kind=model.value,shift=kind==='up'?1:kind==='down'?-2:kind==='guarded'?1:0;const x0=w/2,unit=Math.max(8,Math.min(26,w/(2*R+8))),lineY=h*.56;const X=n=>x0+n*unit;ctx.fillStyle='#123932';ctx.fillRect(X(-R),lineY-35,Math.max(4,2*R*unit),70);ctx.strokeStyle='#53bba3';ctx.strokeRect(X(-R),lineY-35,Math.max(4,2*R*unit),70);ctx.strokeStyle='#627e80';ctx.beginPath();ctx.moveTo(10,lineY);ctx.lineTo(w-10,lineY);ctx.stroke();ctx.font='12px monospace';for(let n=-Math.min(18,Math.ceil(w/unit));n<=Math.min(18,Math.ceil(w/unit));n++){if(n%2===0){ctx.fillStyle='#adc7c3';ctx.fillText(n,X(n)-5,lineY+54)}ctx.beginPath();ctx.moveTo(X(n),lineY-4);ctx.lineTo(X(n),lineY+4);ctx.stroke()}
const value=kind==='reflect'?(steps%2?20:0):shift*steps;let px=x0,py=lineY-4;ctx.beginPath();ctx.moveTo(px,py);for(let i=1;i<=steps;i++){const current=kind==='reflect'?(i%2?20:0):shift*i;const nx=X(current);ctx.lineTo(nx,lineY-12-(i%2)*25)}ctx.strokeStyle='#ffad67';ctx.lineWidth=3;ctx.stroke();ctx.beginPath();ctx.arc(X(value),lineY-12-(steps%2)*25,6,0,Math.PI*2);ctx.fillStyle=Math.abs(value)>R?'#ff785f':'#66e2c3';ctx.fill();ctx.lineWidth=1;
const proven=kind==='up'||kind==='down';const status=proven?'PROVEN NO FINITE INDUCTIVE INTERVAL':kind==='reflect'?'BOUNDED INVARIANT EXISTS':'NO IMPOSSIBILITY PROOF';verdict.textContent=status;verdict.style.color=proven?'#ff986b':'#72dbb5';rlabel.textContent=R;
const k=shift,escape=proven?Math.floor(R/Math.abs(k))+1:null;details.textContent=proven?`Initial state: 0\nGlobally enabled: s ↦ s ${k>=0?'+':''}${k}\nAny finite ${k>0?'upper':'lower'} bound can be escaped\nExample bound: ${k>0?R:-R}\nSteps to escape: ${escape}\nDestination: ${escape*k}\n\nProof: s(n)=0+n·(${k})\nFinite tests ≠ proof`:`Initial state: 0\n${kind==='reflect'?'Transition: s ↦ 20−s\nInductive interval: [0,20]':'Shift is guarded; eligibility not modeled'}\n\nNo universal impossibility theorem triggered.`;}
model.onchange=()=>{steps=0;draw()};radius.oninput=draw;document.getElementById('advance').onclick=()=>{steps=Math.min(steps+1,32);draw()};document.getElementById('reset').onclick=()=>{steps=0;draw()};new ResizeObserver(draw).observe(c);draw();
</script></body></html>
