name: Jane B147.2 One Shadow Five Spheres
on:
  push:
    paths:
      - 'b147/first-shadow-five-spheres-v1.json'
      - 'scripts/btf2/jane-b147-2-first-shadow-five-spheres.cjs'
      - 'scripts/btf2/test-jane-b147-2-first-shadow-five-spheres.cjs'
      - '.github/workflows/b147-2-one-shadow-five-spheres.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/btf2/test-jane-b147-2-first-shadow-five-spheres.cjs
