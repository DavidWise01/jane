name: Jane B150 Pixel Sphere Telemetry
on:
  push:
    paths:
      - 'b150/**'
      - 'scripts/btf2/jane-b150-pixel-sphere-telemetry.cjs'
      - 'scripts/btf2/test-jane-b150-pixel-sphere-telemetry.cjs'
      - '.github/workflows/b150-jane-pixel-sphere-telemetry.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/btf2/test-jane-b150-pixel-sphere-telemetry.cjs
