name: JANE B168 Proof-Carrying Repair Proposal
on:
  push:
    paths:
      - 'scripts/btf2/jane-b168-proof-proposal.cjs'
      - 'scripts/btf2/test-jane-b168-proof-proposal.cjs'
      - 'b168/**'
      - '.github/workflows/b168-proof-proposal.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run B168 proof-bound regression
        run: node scripts/btf2/test-jane-b168-proof-proposal.cjs
