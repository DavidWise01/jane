name: JANE 222 — bounded collective choice probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-choice:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bounded dependency
        run: python -m pip install -r experiments/jane222/requirements.txt
      - name: Run regression tests
        run: cd experiments/jane222 && python -W error -m unittest -q test_choice_runner.py
      - name: Record observed choice (no execution, no repository writes)
        run: |
          cd experiments/jane222
          python choice_runner.py --trust trusted_runtime_keys.json --packets responses.json --output choice-receipt.json
          python - <<'PY'
          import json
          r=json.load(open('choice-receipt.json',encoding='utf-8'))
          assert r['decision_status']=='NO_AUTHENTICATED_COLLECTIVE_RESPONSE'
          assert r['choice'] is None and not r['action_executed']
          print('EXPECTED FAIL-CLOSED: no pinned runtime response, no invented Jane choice')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: jane222-choice-receipt
          path: experiments/jane222/choice-receipt.json
          if-no-files-found: error