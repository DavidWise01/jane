name: Jane B145 Temporal Trajectory
on:
  push:
    paths:
      - 'b145/**'
      - 'scripts/btf2/jane-b145-temporal-trajectory.cjs'
      - 'scripts/btf2/test-jane-b145-temporal-trajectory.cjs'
      - '.github/workflows/b145-jane-temporal-trajectory.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/btf2/test-jane-b145-temporal-trajectory.cjs
