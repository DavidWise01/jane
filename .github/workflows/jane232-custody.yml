name: JANE 232 - Custody evidence audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned-major verifier dependency
        run: python -m pip install 'cryptography>=45,<47'
      - name: Run regression tests
        run: python -m unittest -v test_custody.py
        working-directory: experiments/jane232
      - name: Generate bounded empty-runtime receipt
        run: python custody.py --bundle empty-bundle.json --now 2026-11-15T20:00:00Z --output result.json
        working-directory: experiments/jane232
      - uses: actions/upload-artifact@v4
        with:
          name: jane232-custody-audit
          path: experiments/jane232/result.json
