name: Jane B136 Three Independent Witnesses
on:
  push:
    paths:
      - 'scripts/btf2/jane-b136-witnesses.cjs'
      - 'scripts/btf2/test-jane-b136-witnesses.cjs'
      - 'governance/JANE-B136-THREE-WITNESSES-v1.0.md'
      - '.github/workflows/b136-jane-witnesses.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/btf2/test-jane-b136-witnesses.cjs
