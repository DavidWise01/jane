name: B87 FORMIC append-only repository memory
on:
  workflow_dispatch:
  schedule:
    - cron: "49 7 * * *"
permissions:
  contents: write
concurrency:
  group: b87-memory
  cancel-in-progress: false
jobs:
  append-formic-memory:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Discover public repos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/btf2/index-repos.cjs
      - name: Observe scoped repository metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/btf2/formic-repo-observers.cjs
      - name: Append per-repository memory records
        run: node scripts/btf2/formic-memory.cjs
      - name: Commit newly created memory run only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add btf2/memory/
          if ! git diff --cached --quiet; then
            git commit -m "memory(formic): append B87 public observer run"
            git push
          fi
