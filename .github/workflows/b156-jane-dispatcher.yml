name: Jane B156 Dispatcher and Replay
on:
  push:
    paths:
      - 'b156/**'
      - 'scripts/btf2/jane-b156-dispatcher.cjs'
      - 'scripts/btf2/test-jane-b156-dispatcher.cjs'
      - '.github/workflows/b156-jane-dispatcher.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/btf2/test-jane-b156-dispatcher.cjs
