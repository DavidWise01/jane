name: JANE B174 Exact Tree-Difference Proof
on:
  push:
    paths:
      - 'scripts/btf2/jane-b174-tree-diff.cjs'
      - 'scripts/btf2/test-jane-b174-tree-diff.cjs'
      - 'scripts/btf2/jane-b174-autonomous-manifest.cjs'
      - 'scripts/btf2/test-jane-b174-autonomous-manifest.cjs'
      - 'ecosystem/proposals/**'
      - 'b174/**'
      - '.github/workflows/b174-tree-diff.yml'
  schedule:
    - cron: '07 13 * * *'
  workflow_dispatch:
permissions:
  contents: read
  checks: read
  statuses: read
concurrency:
  group: jane-b174-tree-diff
  cancel-in-progress: false
jobs:
  manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Native B168-B174 regression
        run: |
          node scripts/btf2/test-jane-b168-proof-proposal.cjs
          node scripts/btf2/test-jane-b169-drift-and-ci.cjs
          node scripts/btf2/test-jane-b170-isolated-evaluation.cjs
          node scripts/btf2/test-jane-b171-triple-evidence.cjs
          node scripts/btf2/test-jane-b172-controlled-integration.cjs
          node scripts/btf2/test-jane-b173-pinned-tree.cjs
          node scripts/btf2/test-jane-b174-tree-diff.cjs
          node scripts/btf2/test-jane-b174-autonomous-manifest.cjs
      - name: Read pinned data, compare exact tree delta
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/btf2/jane-b174-autonomous-manifest.cjs --output ecosystem/reports/b174-latest.json
      - name: Preserve B174 proof artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jane-b174-exact-diff
          path: ecosystem/reports/b174-latest.json
          if-no-files-found: warn
          retention-days: 30
