name: Jane B147.1 Shadow Zero
on:
  push:
    paths:
      - 'b147/shadow-base-v1.json'
      - 'scripts/btf2/jane-b147-1-shadow-base.cjs'
      - 'scripts/btf2/test-jane-b147-1-shadow-base.cjs'
      - '.github/workflows/b147-1-shadow-base.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/btf2/test-jane-b147-1-shadow-base.cjs
