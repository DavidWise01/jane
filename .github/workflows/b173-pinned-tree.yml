name: JANE B173 Pinned Repository Tree Integration
on:
  push:
    paths:
      - 'scripts/btf2/jane-b173-pinned-tree.cjs'
      - 'scripts/btf2/test-jane-b173-pinned-tree.cjs'
      - 'scripts/btf2/jane-b173-autonomous-tree.cjs'
      - 'scripts/btf2/test-jane-b173-autonomous-tree.cjs'
      - 'ecosystem/proposals/**'
      - 'b173/**'
      - '.github/workflows/b173-pinned-tree.yml'
  schedule:
    - cron: '41 12 * * *'
  workflow_dispatch:
permissions:
  contents: read
  checks: read
  statuses: read
concurrency:
  group: jane-b173-pinned-tree
  cancel-in-progress: false
jobs:
  pinned-tree-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Native regression and scratch Git application
        run: |
          node scripts/btf2/test-jane-b168-proof-proposal.cjs
          node scripts/btf2/test-jane-b169-drift-and-ci.cjs
          node scripts/btf2/test-jane-b170-isolated-evaluation.cjs
          node scripts/btf2/test-jane-b171-triple-evidence.cjs
          node scripts/btf2/test-jane-b172-controlled-integration.cjs
          node scripts/btf2/test-jane-b173-pinned-tree.cjs
          node scripts/btf2/test-jane-b173-autonomous-tree.cjs
      - name: Reobserve fresh base and verify full bounded Git tree data without executing its code
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/btf2/jane-b173-autonomous-tree.cjs --output ecosystem/reports/b173-latest.json
      - name: Preserve result evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jane-b173-pinned-tree-integration
          path: ecosystem/reports/b173-latest.json
          if-no-files-found: warn
          retention-days: 30
