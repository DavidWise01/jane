name: B114 evidence-linked generational learning
on:
  workflow_dispatch:
  schedule:
    - cron: '11 */6 * * *'
permissions:
  contents: write
concurrency:
  group: b114-generational-learning
  cancel-in-progress: false
jobs:
  evidence-learning:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test learning invariants
        run: node scripts/btf2/test-b114-learning.cjs
      - name: Analyze verified B87 observations
        run: node scripts/btf2/b114-generational-learning.cjs
      - name: Publish derived evidence-linked lessons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add b114/lessons.json
          git diff --cached --quiet || (git commit -m "data(jane): B114 historical observation lessons" && git push)
