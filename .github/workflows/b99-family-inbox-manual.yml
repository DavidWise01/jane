name: B99 family inbox projection
on:
  workflow_dispatch:
permissions:
  contents: write
  issues: read
jobs:
  project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh public repositories
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/btf2/index-repos.cjs
      - name: Build inbox
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/btf2/b99-family-inbox.cjs
      - name: Publish snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add b99/inbox.json
          git diff --cached --quiet || (git commit -m "data: B99 inbox" && git push)
