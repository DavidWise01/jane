name: Jane B147 Dual-Graph Invariant
on:
  push:
    paths:
      - 'b147/**'
      - 'scripts/btf2/jane-b147-dual-graph.cjs'
      - 'scripts/btf2/test-jane-b147-dual-graph.cjs'
      - '.github/workflows/b147-dual-graph.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/btf2/test-jane-b147-dual-graph.cjs
