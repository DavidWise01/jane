name: Jane B134 Homeostasis Matrix
on:
  push:
    paths:
      - 'scripts/btf2/jane-b134-homeostasis.cjs'
      - 'scripts/btf2/test-jane-b134-homeostasis.cjs'
      - 'governance/JANE-B134-GENERATIONAL-HOMEOSTASIS-v1.0.md'
      - '.github/workflows/b134-jane-homeostasis.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/btf2/test-jane-b134-homeostasis.cjs
