name: JANE 225 — verify signed component responses (manual, read only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned dependency
        run: python -m pip install -r experiments/jane225/requirements.txt
      - name: Verify regression suite
        working-directory: experiments/jane225
        run: python -W error -m unittest -q test_agent_reply.py
      - name: Generate fresh question and verify configured packets
        working-directory: experiments/jane225
        shell: bash
        run: |
          python prepare.py challenge.json
          python agent_reply.py --challenge challenge.json --trust trusted_runtime_keys.json --responses responses.json --audit replay.sqlite3 --output choice-receipt.json
      - uses: actions/upload-artifact@v4
        with:
          name: jane225-decision-boundary
          path: |
            experiments/jane225/challenge.json
            experiments/jane225/choice-receipt.json
          retention-days: 7