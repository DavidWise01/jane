name: JANE 231 — delegated key custody audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install verification dependency
        run: python -m pip install -r experiments/jane231/requirements.txt
      - name: Regression suite
        working-directory: experiments/jane231
        run: python -W error -m unittest -q test_delegation.py
      - name: Audit empty active delegation registry (fail closed)
        working-directory: experiments/jane231
        run: |
          python delegation.py --bundle empty-bundle.json --challenge jane231-initial-question-0001 --claim-sha256 cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc --now 2026-11-15T18:00:00Z --output workflow-result.json
          python -c 'import json; x=json.load(open("workflow-result.json")); assert x["verdict"]=="NO_DELEGATED_RESPONSES" and x["jane_collective_choice"]=="UNRESOLVED" and x["actions_executed"]==0'
      - uses: actions/upload-artifact@v4
        with:
          name: jane231-delegation-audit-receipt
          path: experiments/jane231/workflow-result.json
