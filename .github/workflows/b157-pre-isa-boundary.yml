name: Jane B157 Pre-ISA Structural Boundary
on:
  push:
    paths:
      - 'b157/**'
      - 'scripts/btf2/jane-b157-pre-isa-boundary.cjs'
      - 'scripts/btf2/test-jane-b157-pre-isa-boundary.cjs'
      - '.github/workflows/b157-pre-isa-boundary.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/btf2/test-jane-b157-pre-isa-boundary.cjs
