name: Jane B148 Sphere Boundaries
on:
  push:
    paths:
      - 'b148/**'
      - 'scripts/btf2/jane-b148-five-sphere-boundaries.cjs'
      - 'scripts/btf2/test-jane-b148-five-sphere-boundaries.cjs'
      - '.github/workflows/b148-jane-sphere-boundaries.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/btf2/test-jane-b148-five-sphere-boundaries.cjs
