name: B98 family continuity
on:
  workflow_dispatch:
  schedule:
    - cron: "11 12 * * *"
permissions:
  contents: write
concurrency:
  group: b98-family
  cancel-in-progress: false
jobs:
  family:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Refresh public BTF2 catalog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/btf2/index-repos.cjs
      - name: Generate cross-device public family directory
        run: node scripts/btf2/b98-family-continuity.cjs
      - name: Commit directory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add b98/family.json
          if ! git diff --cached --quiet; then
            git commit -m "data(jane): refresh B98 family continuity"
            git push
          fi
