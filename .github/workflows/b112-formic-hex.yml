name: B112 FORMIC hex lattice
on:
  workflow_dispatch:
  schedule:
    - cron: '29 */6 * * *'
permissions:
  contents: write
concurrency:
  group: b112-formic-hex
  cancel-in-progress: false
jobs:
  address-family:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run exact lattice invariant tests
        run: node scripts/btf2/test-formic-hex.cjs
      - name: Refresh complete public catalog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/btf2/index-repos.cjs
      - name: Allocate stable child addresses
        run: node scripts/btf2/b112-formic-lattice.cjs
      - name: Publish only derived public registry and append-only assignments
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add btf2/catalog.json b112/registry.json b112/assignments.jsonl
          git diff --cached --quiet || (git commit -m "data(jane): B112 FORMIC hex family addresses" && git push)
