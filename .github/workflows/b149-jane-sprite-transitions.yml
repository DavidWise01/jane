name: Jane B149 Code Monkey Sphere Transitions
on:
  push:
    paths:
      - 'b149/**'
      - 'scripts/btf2/jane-b149-sphere-transitions.cjs'
      - 'scripts/btf2/test-jane-b149-sphere-transitions.cjs'
      - '.github/workflows/b149-jane-sprite-transitions.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/btf2/test-jane-b149-sphere-transitions.cjs
