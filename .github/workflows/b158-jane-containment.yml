name: Jane B158 Three Source Containment
on:
  push:
    paths:
      - 'b158/**'
      - 'scripts/btf2/jane-b158-containment.cjs'
      - 'scripts/btf2/test-jane-b158-containment.cjs'
      - '.github/workflows/b158-jane-containment.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/btf2/test-jane-b158-containment.cjs
