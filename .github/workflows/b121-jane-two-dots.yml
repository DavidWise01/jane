name: B121 Two-dot Coherence Registry
on:
  push:
    paths:
      - 'b121/**'
      - 'governance/JANE-B121-TWO-DOTS-COHERENCE-v1.0.md'
      - 'scripts/btf2/jane-b121-two-dots.cjs'
      - 'scripts/btf2/test-jane-b121-two-dots.cjs'
      - '.github/workflows/b121-jane-two-dots.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check sixteen stable logical dot addresses
        run: node scripts/btf2/test-jane-b121-two-dots.cjs
