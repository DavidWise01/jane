name: JANE B172 Controlled Scratch Integration
on:
  push:
    paths:
      - 'scripts/btf2/jane-b172-controlled-integration.cjs'
      - 'scripts/btf2/test-jane-b172-controlled-integration.cjs'
      - 'scripts/btf2/jane-b172-autonomous-integration.cjs'
      - 'scripts/btf2/test-jane-b172-autonomous-integration.cjs'
      - 'ecosystem/proposals/**'
      - 'b172/**'
      - '.github/workflows/b172-controlled-integration.yml'
  schedule:
    - cron: '13 12 * * *'
  workflow_dispatch:
permissions:
  contents: read
  checks: read
  statuses: read
concurrency:
  group: jane-b172-controlled-integration
  cancel-in-progress: false
jobs:
  controlled-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regression suite and native scratch Git apply
        run: |
          node scripts/btf2/test-jane-b168-proof-proposal.cjs
          node scripts/btf2/test-jane-b169-drift-and-ci.cjs
          node scripts/btf2/test-jane-b170-isolated-evaluation.cjs
          node scripts/btf2/test-jane-b171-triple-evidence.cjs
          node scripts/btf2/test-jane-b172-controlled-integration.cjs
          node scripts/btf2/test-jane-b172-autonomous-integration.cjs
      - name: Re-observe, bind and scratch-apply committed proposals
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/btf2/jane-b172-autonomous-integration.cjs --output ecosystem/reports/b172-latest.json
      - name: Retain no-write integration report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jane-b172-scratch-integration
          path: ecosystem/reports/b172-latest.json
          if-no-files-found: warn
          retention-days: 30
