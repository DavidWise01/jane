name: Jane B146 Uploaded Distance Gravity Audit
on:
  push:
    paths:
      - 'b146/distance-gravity-source-v1.json'
      - 'scripts/btf2/jane-b146-uploaded-distance-audit.cjs'
      - 'scripts/btf2/test-jane-b146-uploaded-distance-audit.cjs'
      - '.github/workflows/b146-jane-uploaded-distance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/btf2/test-jane-b146-uploaded-distance-audit.cjs
