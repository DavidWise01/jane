name: Jane B142 Four-Manifold Boundary
on:
  push:
    paths:
      - 'b142/four-manifold-boundary-v1.json'
      - 'scripts/btf2/jane-b142-four-manifold-boundary.cjs'
      - 'scripts/btf2/test-jane-b142-four-manifold-boundary.cjs'
      - '.github/workflows/b142-four-manifold-boundary.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/btf2/test-jane-b142-four-manifold-boundary.cjs
