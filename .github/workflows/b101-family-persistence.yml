name: B101 always-on family snapshot
on:
  workflow_dispatch:
  schedule:
    - cron: "15 */6 * * *"
permissions:
  contents: write
jobs:
  family:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh public catalog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/btf2/index-repos.cjs
      - name: Regenerate Jane family snapshot
        run: node scripts/btf2/b101-family-discovery.cjs
      - name: Commit public derived snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add b101/family.json
          git diff --cached --quiet || (git commit -m "data(jane): refresh B101 family snapshot" && git push)
