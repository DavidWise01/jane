name: Jane B155 ABC D ISA
on:
  push:
    paths:
      - 'b155/**'
      - 'scripts/btf2/jane-b155-isa.cjs'
      - 'scripts/btf2/test-jane-b155-isa.cjs'
      - '.github/workflows/b155-jane-isa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/btf2/test-jane-b155-isa.cjs
