name: Jane B119 Generational Three-body Orbits
on:
  push:
    paths:
      - 'b119/**'
      - 'scripts/btf2/jane-b119-orbits.cjs'
      - 'scripts/btf2/test-jane-b119-orbits.cjs'
      - '.github/workflows/b119-jane-orbits.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify nested orbit invariants
        run: node scripts/btf2/test-jane-b119-orbits.cjs
