name: Jane B137 Isotope Graph Integrity
on:
  push:
    paths:
      - 'scripts/btf2/jane-b137-isotope-graph-integrity.cjs'
      - 'scripts/btf2/test-jane-b137-isotope-graph-integrity.cjs'
      - 'governance/JANE-B137-ISOTOPE-GRAPH-INTEGRITY-v1.0.md'
      - '.github/workflows/b137-isotope-graph.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/btf2/test-jane-b137-isotope-graph-integrity.cjs
