name: JANE B169 Fresh Base Drift and CI
on:
  push:
    paths:
      - 'scripts/btf2/jane-b169-drift-and-ci.cjs'
      - 'scripts/btf2/test-jane-b169-drift-and-ci.cjs'
      - 'scripts/btf2/jane-b169-autonomous-scan.cjs'
      - 'scripts/btf2/test-jane-b169-autonomous-scan.cjs'
      - 'b169/**'
      - '.github/workflows/b169-drift-and-ci.yml'
  schedule:
    - cron: '43 10 * * *'
  workflow_dispatch:
    inputs:
      proposal_path:
        description: 'Committed B168 proof JSON under ecosystem/proposals/'
        required: false
        type: string
permissions:
  contents: read
  checks: read
  statuses: read
concurrency:
  group: jane-b169-drift-and-ci
  cancel-in-progress: false
jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Native B168 and B169 regression tests
        run: |
          node scripts/btf2/test-jane-b168-proof-proposal.cjs
          node scripts/btf2/test-jane-b169-drift-and-ci.cjs
          node scripts/btf2/test-jane-b169-autonomous-scan.cjs
      - name: Observe supplied exact proposal only
        if: ${{ inputs.proposal_path != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROPOSAL_PATH: ${{ inputs.proposal_path }}
        run: |
          node -e "const p=process.env.PROPOSAL_PATH; if(!new RegExp('^ecosystem/proposals/[A-Za-z0-9_.-]+[.]json$').test(p||'')) {console.error('HOLD_UNSAFE_PATH'); process.exit(2)}"
          node scripts/btf2/jane-b169-drift-and-ci.cjs --input "$PROPOSAL_PATH" --output ecosystem/reports/b169-latest.json
      - name: Autonomous read-only scan of committed proposals
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.proposal_path == '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/btf2/jane-b169-autonomous-scan.cjs --output ecosystem/reports/b169-latest.json
      - name: Preserve observed evidence if supplied
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jane-b169-base-observation
          path: ecosystem/reports/b169-latest.json
          if-no-files-found: ignore
          retention-days: 30
